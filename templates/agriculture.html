<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agricultural Production Insights</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --font-body: "DM Sans", "Segoe UI", sans-serif;
      --font-display: "DM Serif Display", Georgia, serif;
      font-family: var(--font-body);
      background: #eaf1f5;
      color: #193c32;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
    }

    header {
      position: relative;
      padding: 18px 24px;
      background: #f5f9fb;
      border-bottom: 1px solid #d3e0e7;
    }

    h1 {
      width: calc(100% - 100px);
      margin: 0 auto;
      color: #174b3a;
      font-family: var(--font-display);
      font-size: 34px;
      font-weight: 400;
      line-height: 1.2;
      text-align: center;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.8), 0 4px 6px rgba(23, 75, 58, 0.32), 0 9px 16px rgba(23, 75, 58, 0.18);
    }

    .story-section {
      max-width: 1468px;
      margin: 32px auto 0;
      scroll-margin-top: 16px;
    }

    .story-section h2 {
      margin: 0 0 16px;
      color: #245c48;
      font-family: var(--font-display);
      font-size: 30px;
      font-weight: 400;
      line-height: 1.25;
      text-align: center;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.8), 0 4px 6px rgba(23, 75, 58, 0.3), 0 8px 14px rgba(23, 75, 58, 0.16);
    }

    .story-button {
      position: absolute;
      top: 50%;
      right: 24px;
      transform: translateY(-50%);
      padding: 10px 18px;
      border-radius: 4px;
      background: #1b6b52;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
      text-decoration: none;
    }

    .story-button:hover,
    .story-button:focus-visible {
      background: #14513e;
    }

    main {
      padding: 20px 24px 32px;
    }

    .tableauPlaceholder {
      position: relative;
      width: 100%;
      max-width: 1468px;
      margin: 0 auto;
    }

    .tableauViz {
      display: none;
      width: 100%;
    }

    noscript img {
      display: block;
      width: 100%;
      border: 0;
    }

    @media (max-width: 600px) {
      header {
        display: grid;
        grid-template-columns: 1fr auto;
        padding: 16px;
      }

      h1 {
        grid-column: 1 / -1;
        width: 100%;
        font-size: 28px;
      }

      .story-button {
        position: static;
        grid-column: 2;
        grid-row: 2;
        justify-self: end;
        transform: none;
        padding: 9px 12px;
        font-size: 14px;
      }

      .story-section h2 {
        font-size: 25px;
      }

      main {
        padding: 12px 0 24px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>Agricultural Production Insights</h1>
    <a class="story-button" href="#story">Story</a>
  </header>

  <main>
    <div class="tableauPlaceholder" id="viz1791302884842">
      <noscript>
        <a href="https://public.tableau.com/views/Book2_17913001877340/Agriculturalproductioninsights">
          <img alt="Agricultural production insights dashboard" src="https://public.tableau.com/static/images/Bo/Book2_17913001877340/Agriculturalproductioninsights/1_rss.png">
        </a>
      </noscript>
      <object class="tableauViz">
        <param name="host_url" value="https%3A%2F%2Fpublic.tableau.com%2F">
        <param name="embed_code_version" value="3">
        <param name="site_root" value="">
        <param name="name" value="Book2_17913001877340/Agriculturalproductioninsights">
        <param name="tabs" value="no">
        <param name="toolbar" value="yes">
        <param name="static_image" value="https://public.tableau.com/static/images/Bo/Book2_17913001877340/Agriculturalproductioninsights/1.png">
        <param name="animate_transition" value="yes">
        <param name="display_static_image" value="yes">
        <param name="display_spinner" value="yes">
        <param name="display_overlay" value="yes">
        <param name="display_count" value="yes">
        <param name="language" value="en-US">
      </object>
    </div>

    <section class="story-section" id="story">
      <h2>Trend of Agricultural Yield (1997-2021)</h2>
      <div class="tableauPlaceholder" id="viz1791347384240">
        <noscript>
          <a href="https://public.tableau.com/views/Book1_17908697140750/trendofagriculturalyeild1997-2021_1">
            <img alt="Trend of agricultural yield from 1997 to 2021" src="https://public.tableau.com/static/images/Bo/Book1_17908697140750/trendofagriculturalyeild1997-2021_1/1_rss.png">
          </a>
        </noscript>
        <object class="tableauViz">
          <param name="host_url" value="https%3A%2F%2Fpublic.tableau.com%2F">
          <param name="embed_code_version" value="3">
          <param name="site_root" value="">
          <param name="name" value="Book1_17908697140750/trendofagriculturalyeild1997-2021_1">
          <param name="tabs" value="no">
          <param name="toolbar" value="yes">
          <param name="static_image" value="https://public.tableau.com/static/images/Bo/Book1_17908697140750/trendofagriculturalyeild1997-2021_1/1.png">
          <param name="animate_transition" value="yes">
          <param name="display_static_image" value="yes">
          <param name="display_spinner" value="yes">
          <param name="display_overlay" value="yes">
          <param name="display_count" value="yes">
          <param name="language" value="en-US">
        </object>
      </div>
    </section>
  </main>

  <script>
    const tableauPlaceholder = document.getElementById('viz1791302884842');
    const tableauViz = tableauPlaceholder.querySelector('object');

    function resizeTableauViz() {
      const mobile = window.matchMedia('(max-width: 768px)').matches;
      const minimumHeight = mobile ? 1450 : 900;
      const aspectRatio = mobile ? 1.77 : 0.99;
      tableauViz.style.height = Math.max(minimumHeight, tableauPlaceholder.clientWidth * aspectRatio) + 'px';

      const storyPlaceholder = document.getElementById('viz1791347384240');
      const storyViz = storyPlaceholder.querySelector('object');
      storyViz.style.height = storyPlaceholder.clientWidth * 0.75 + 'px';
    }

    resizeTableauViz();
    window.addEventListener('resize', resizeTableauViz);

    const tableauScript = document.createElement('script');
    tableauScript.src = 'https://public.tableau.com/javascripts/api/viz_v1.js';
    tableauViz.parentNode.insertBefore(tableauScript, tableauViz);

    const storyViz = document.getElementById('viz1791347384240').querySelector('object');
    const storyScript = document.createElement('script');
    storyScript.src = 'https://public.tableau.com/javascripts/api/viz_v1.js';
    storyViz.parentNode.insertBefore(storyScript, storyViz);
  </script>
</body>

</html>
